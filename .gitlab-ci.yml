image: ${BENCHMARKS_REGISTRY}/eic_xl${BENCHMARKS_SIGIL}${BENCHMARKS_TAG}

variables:
  GITHUB_PR: ''
  GITHUB_REPOSITORY: ''
  GITHUB_SHA: ''
  SNAKEMAKE_FLAGS: '--cache'

workflow:
  name: '$PIPELINE_NAME'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "webide"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_TAG'

default:
  tags:
    - phy-scratch
  artifacts:
    expire_in: 72 hours
    paths:
      - .snakemake/log
      - logs
      - results
      - config
      - .env
      - summary.txt
    reports:
      dotenv: .env
    when: always

stages:
  - status-pending
  - config
  - benchmarks
  - collect
  - deploy
  - status-report

.status:
  image: curlimages/curl:latest
  rules:
    - if: $GITHUB_SHA !~ /^$/ # when GITHUB_SHA non-empty
  script:
    - |
      curl \
        -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: token ${GITHUB_REPO_STATUS_TOKEN}" \
        "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
        -d '{"state":"'"${STATE}"'",
             "target_url":"'"${CI_PIPELINE_URL}"'",
             "description":"'"$(TZ=America/New_York date)"'",
             "context":"eicweb/generator_benchmarks ('"${BENCHMARKS_TAG}"')"
            }' ;
  retry:
    max: 2
    when:
      - runner_system_failure


benchmarks:generator:pending:
  stage: status-pending
  extends: .status
  variables:
    STATE: "pending"
  when: always

common:setup:
  stage: config
  image: alpine
  before_script:
  script:
    - source bin/env.sh
    - export PATH="${CI_PROJECT_DIR}/bin:${PATH}"
    - |
      echo "BENCHMARKS_TAG: ${BENCHMARKS_TAG}"
      echo "BENCHMARKS_CONTAINER: ${BENCHMARKS_CONTAINER}"
      echo "BENCHMARKS_REGISTRY: ${BENCHMARKS_REGISTRY}"
    - |
      bin/mkdir_local_data_link sim_output
    - |
      mkdir -p results
      mkdir -p config

.det_benchmark:
  needs:
    - ["common:setup"]
  before_script:
    - source bin/env.sh
    - export PATH="${CI_PROJECT_DIR}/bin:${PATH}"
    - ls -lrtha
    - bin/mkdir_local_data_link sim_output
    - mkdir -p "$SNAKEMAKE_OUTPUT_CACHE"
    - ls -lrtha
  retry:
    max: 2
    when:
      - runner_system_failure

include:
  - local: 'benchmarks/pythia8/config.yml'

deploy_results:
  allow_failure: true
  extends: .det_benchmark
  stage: deploy
  needs:
    - "collect_results:pythia8"
  script:
    - snakemake $SNAKEMAKE_FLAGS --cores 1 results/metadata.json
    - find results -print | sort | tee summary.txt
  retry:
    max: 2
    when:
      - runner_system_failure

benchmarks:generator:success:
  stage: status-report
  dependencies: []
  extends: .status
  variables:
    STATE: "success"
  after_script:
    # Cleanup scratch space
    - rm -rfv $LOCAL_DATA_PATH
  when: on_success

benchmarks:generator:failure:
  stage: status-report
  dependencies: []
  extends: .status
  variables:
    STATE: "failure"
  when: on_failure
